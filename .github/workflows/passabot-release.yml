name: passabot-release

# ze-codigos fork addition: publish prebuilt ai-memory CLI binaries so the
# passabot-memory onboarding can `curl` them instead of requiring every dev to
# have Rust + a C toolchain (`cargo install --git` was the #1 onboarding
# blocker). Complements passabot-image.yml (server image); the artifact set
# here is CLI-only.
#
# Trigger: push of a `passabot-v<cargo version>-<suffix>` tag (e.g.
# passabot-v1.28.0-r1) on the passabot/upstream-patches branch — bump the
# suffix (r2, r3, ...) to re-release the same version. Tag-push triggers use
# the workflow file at the tag's commit, so this works without living on the
# default branch (workflow_dispatch would require that, and `main` is the
# upstream mirror). The pattern matches neither upstream release.yml
# (`v*.*.*`) nor passabot-image.yml (`v*-passabot.*`), so no other workflow
# fires.
#
# Targets: linux x86_64 (also covers WSL2), linux aarch64, macos aarch64,
# macos x86_64 and windows x86_64 (MEM-11: the plugin runs natively on
# Windows through Git Bash; the Claude Desktop app does not load plugins in
# WSL sessions, so the native binary is the only way there).
#
# MEM-11 (temporary, remove before the PR merges): pushes to the feature
# branch build ONLY the windows job so the .exe can be fetched as a workflow
# artifact (`gh run download`) without cutting a tag. workflow_dispatch is not
# an option because it needs the workflow on the default branch.

on:
  push:
    tags:
      - "passabot-v*"
    branches:
      - "feat/MEM-11-windows-nativo"

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.artifact }}
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - artifact: ai-memory-linux-x86_64
            runner: ubuntu-22.04
          - artifact: ai-memory-linux-aarch64
            runner: ubuntu-22.04-arm
          - artifact: ai-memory-macos-aarch64
            runner: macos-15
          - artifact: ai-memory-macos-x86_64
            runner: macos-15-intel
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # 1.95
        with:
          toolchain: "1.95"

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2

      - name: Build release binary
        env:
          TAILWIND_SKIP: "1"
        run: cargo build --release -p ai-memory-cli

      # CLI-only tarball: just the binary + checksum. The passabot-memory
      # plugin never uses upstream's hooks/packaging/docs payload.
      - name: Create release tarball
        env:
          RELEASE_ARTIFACT: ${{ matrix.artifact }}
        run: |
          set -euo pipefail
          artifact="$RELEASE_ARTIFACT"
          mkdir -p "dist/$artifact"
          cp target/release/ai-memory "dist/$artifact/ai-memory"
          tar -C "dist/$artifact" -czf "$artifact.tar.gz" .
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "$artifact.tar.gz" > "$artifact.tar.gz.sha256"
          else
            shasum -a 256 "$artifact.tar.gz" > "$artifact.tar.gz.sha256"
          fi

      - name: Smoke test tarball
        env:
          RELEASE_ARTIFACT: ${{ matrix.artifact }}
        run: |
          set -euo pipefail
          artifact="$RELEASE_ARTIFACT"
          smoke="dist/smoke-$artifact"
          mkdir -p "$smoke"
          tar -xzf "$artifact.tar.gz" -C "$smoke"
          "$smoke/ai-memory" --version
          grep -Eq "^[0-9a-f]{64}  $artifact\.tar\.gz$" "$artifact.tar.gz.sha256"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.artifact }}
          path: |
            ${{ matrix.artifact }}.tar.gz
            ${{ matrix.artifact }}.tar.gz.sha256

  windows:
    name: ai-memory-windows-x86_64
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # 1.95
        with:
          toolchain: "1.95"

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2

      - name: Build release binary
        env:
          TAILWIND_SKIP: "1"
        run: cargo build --release -p ai-memory-cli

      # CLI-only zip: ai-memory.exe + checksum (sha256sum format, like the
      # tarballs). The passabot-memory install.ps1 consumes this asset.
      - name: Create release zip
        shell: pwsh
        env:
          RELEASE_ARTIFACT: ai-memory-windows-x86_64
        run: |
          $ErrorActionPreference = "Stop"
          $artifact = $env:RELEASE_ARTIFACT
          $stage = "dist/$artifact"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item target/release/ai-memory.exe "$stage/ai-memory.exe"
          $zip = "$artifact.zip"
          Get-ChildItem $stage | Compress-Archive -DestinationPath $zip
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLower()
          "$hash  $zip" | Out-File -Encoding ascii "$zip.sha256"

      - name: Smoke test release zip
        shell: pwsh
        env:
          RELEASE_ARTIFACT: ai-memory-windows-x86_64
        run: |
          $ErrorActionPreference = "Stop"
          $artifact = $env:RELEASE_ARTIFACT
          $zip = "$artifact.zip"
          $smoke = "dist/smoke-$artifact"
          Expand-Archive $zip -DestinationPath $smoke -Force
          & "$smoke/ai-memory.exe" --version
          if ($LASTEXITCODE -ne 0) { throw "ai-memory.exe --version failed" }
          $checksum = Get-Content "$zip.sha256" -Raw
          if ($checksum -notmatch "^[0-9a-f]{64}  $artifact\.zip\r?\n?$") {
            throw "checksum is not sha256sum format"
          }

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ai-memory-windows-x86_64
          path: |
            ai-memory-windows-x86_64.zip
            ai-memory-windows-x86_64.zip.sha256

  release:
    name: create github release
    needs: [build, windows]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate tag against Cargo.toml version
        run: |
          set -euo pipefail
          version="$(awk -F ' *= *' '
            /^\[workspace.package\]$/ { in_workspace_package = 1; next }
            /^\[/ { in_workspace_package = 0 }
            in_workspace_package && $1 == "version" {
              gsub(/"/, "", $2);
              print $2;
              exit;
            }
          ' Cargo.toml)"
          [ -n "$version" ] || { echo "could not read version from Cargo.toml" >&2; exit 1; }
          case "$GITHUB_REF_NAME" in
            "passabot-v${version}-"*) ;;
            *) echo "tag $GITHUB_REF_NAME não bate com a versão do Cargo.toml ($version) — use passabot-v${version}-rN" >&2; exit 1 ;;
          esac

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: ai-memory-*
          path: dist
          merge-multiple: true

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          ls -l dist/
          gh release create "$TAG" \
            --title "$TAG (binários CLI para o passabot-memory)" \
            --notes "Binários pré-buildados do \`ai-memory\` (fork ze-codigos, branch \`passabot/upstream-patches\`, commit ${GITHUB_SHA}) consumidos pelo \`install.sh\` do plugin passabot-memory. Targets: linux x86_64/aarch64, macos aarch64/x86_64, windows x86_64 (zip com ai-memory.exe, consumido pelo install.ps1)." \
            dist/*.tar.gz dist/*.tar.gz.sha256 dist/*.zip dist/*.zip.sha256
